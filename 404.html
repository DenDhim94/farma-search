<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 — ФармА-Поиск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --font-main: 'Manrope', 'PT Sans', 'Segoe UI', Roboto, sans-serif;
            --color-primary: #2d6a4f;
            --color-accent: #e63946;
            --color-bg: #f4f7f6;
        }
        body {
            font-family: var(--font-main);
            background:
                radial-gradient(circle at 20% 30%, rgba(108,92,231,0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0,206,201,0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255,234,167,0.2) 0%, transparent 50%),
                linear-gradient(135deg, #f1f2f6 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(45,106,79,0.08);
            animation: float 15s infinite ease-in-out;
        }
        .particle:nth-child(1) { width: 60px; height: 60px; top: 15%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 40px; height: 40px; top: 60%; left: 80%; animation-delay: 2s; background: rgba(230,57,70,0.06); }
        .particle:nth-child(3) { width: 80px; height: 80px; top: 80%; left: 20%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 50px; height: 50px; top: 25%; left: 70%; animation-delay: 1s; background: rgba(0,206,201,0.08); }
        .particle:nth-child(5) { width: 35px; height: 35px; top: 45%; left: 40%; animation-delay: 3s; }
        .particle:nth-child(6) { width: 70px; height: 70px; top: 70%; left: 55%; animation-delay: 5s; background: rgba(255,234,167,0.12); }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
        }
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 24px;
            padding: 60px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            max-width: 520px;
            width: calc(100% - 40px);
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #2d6a4f 0%, #40916c 50%, #e63946 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }
        .error-code .pill { font-size: 4rem; vertical-align: middle; -webkit-text-fill-color: initial; }
        .error-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 12px;
        }
        .error-text {
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 36px;
        }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-family: var(--font-main);
        }
        .btn-primary {
            background: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(45,106,79,0.35);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.8);
            color: var(--color-primary);
            border: 1px solid rgba(45,106,79,0.2);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            background: #fff;
        }
        @media (max-width: 600px) {
            .glass-card { padding: 40px 24px; }
            .error-code { font-size: 4rem; }
            .error-code .pill { font-size: 2.5rem; }
            .error-title { font-size: 1.2rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
        @media (min-resolution: 2dppx) {
            .glass-card { border-width: 0.5px; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <div class="glass-card">
        <div class="error-code">4<span class="pill">&#128138;</span>4</div>
        <h1 class="error-title">Страница не найдена</h1>
        <p class="error-text">Похоже, эта страница куда-то переехала.<br>Давайте вернёмся к поиску лекарств — они точно ещё на месте.</p>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">&#8592; На главную</a>
            <a href="/pharmacies" class="btn btn-secondary">Аптеки Иркутска</a>
        </div>
    </div>
</body>
</html>
